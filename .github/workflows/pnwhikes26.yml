name: PNW Hikes '26 (/pnwhikes26)

# Refreshes the smoke / air-quality / fire data every hour and publishes it to
# S3. The AirNow side is stateful: each hour is a ~1 MB nationwide file, so the
# job restores the previous run's env.json from S3 first and fetch_env.py only
# downloads the hours it lacks (a rolling 26-hour window).

on:
  schedule:
    # :23 past the hour — offset from the rockfire job at :17 and the
    # top-of-hour rush, when GitHub delays scheduled runs most.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "pnwhikes26/**"
      - ".github/workflows/pnwhikes26.yml"

concurrency:
  group: pnwhikes26-publish
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  S3_BUCKET: rick-portfolio-2025
  CLOUDFRONT_DISTRIBUTION_ID: E3HT67NT39EUN4
  PREFIX: pnwhikes26

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore previous env.json
        run: |
          mkdir -p pnwhikes26/data
          if aws s3 cp "s3://$S3_BUCKET/$PREFIX/data/env.json" pnwhikes26/data/env.json 2>/dev/null; then
            echo "restored env.json from S3"
          elif [ -f pnwhikes26/seed/env.json ]; then
            cp pnwhikes26/seed/env.json pnwhikes26/data/env.json
            echo "no published env.json yet — bootstrapped from seed/"
          else
            echo "cold start; fetch will pull the full AirNow window"
          fi

      - name: Fetch live data
        run: python3 pnwhikes26/fetch_env.py

      - name: Sanity-check what we're about to publish
        run: |
          python3 - <<'PY'
          import datetime, json, sys
          env = json.load(open("pnwhikes26/data/env.json"))
          # Refuse to publish a page that would render empty or stale. Failing
          # here leaves the previous hour's data live, which is the safe state.
          problems = []
          if len(env.get("aq", [])) < 20:
              problems.append(f"only {len(env.get('aq', []))} AQ stations")
          now_ms = datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000
          latest = env.get("meta", {}).get("aq_latest_ms") or 0
          if now_ms - latest > 6 * 3600_000:
              problems.append("newest AQ observation is older than 6 h")
          if "features" not in env.get("fires", {}):
              problems.append("fires feed missing")
          if "features" not in env.get("smoke", {}):
              problems.append("smoke feed missing")
          if problems:
              sys.exit("refusing to publish: " + "; ".join(problems))
          print(f"{len(env['aq'])} stations, {len(env['smoke']['features'])} plumes, "
                f"{len(env['fires']['features'])} fires, smoke day {env['meta']['smoke_day']}")
          PY

      - name: Publish data
        run: |
          # Short TTL: refreshed hourly and small.
          aws s3 cp pnwhikes26/data/env.json "s3://$S3_BUCKET/$PREFIX/data/env.json" \
            --cache-control "public, max-age=120" \
            --content-type "application/json" --only-show-errors

      - name: Publish page assets
        if: github.event_name != 'schedule'
        # Assets go up BEFORE index.html: this origin answers a missing key
        # with the site homepage at status 200, so a half-finished upload
        # would publish a page that silently loads HTML where its map library
        # should be. Version-stamped filenames (leaflet-1.9.4.js,
        # bundle-v1.json) because Cloudflare caches .js/.css/.json by URL for
        # hours — content changes must ship under a new name.
        env:
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "5"
        run: |
          put() {
            aws --cli-connect-timeout 15 --cli-read-timeout 120 \
              s3 cp "$1" "s3://$S3_BUCKET/$2" --only-show-errors \
              --content-type "$3" --cache-control "$4"
            echo "  uploaded $2"
          }
          put pnwhikes26/vendor/leaflet-1.9.4.js  "$PREFIX/vendor/leaflet-1.9.4.js" \
              "application/javascript" "public, max-age=31536000, immutable"
          put pnwhikes26/vendor/leaflet-1.9.4.css "$PREFIX/vendor/leaflet-1.9.4.css" \
              "text/css" "public, max-age=31536000, immutable"
          put pnwhikes26/static/bundle-v1.json "$PREFIX/static/bundle-v1.json" \
              "application/json" "public, max-age=31536000, immutable"
          # Extensionless key answers /pnwhikes26 (no trailing slash) with a
          # redirect stub; relative asset paths only resolve from /pnwhikes26/.
          put pnwhikes26/redirect.html "$PREFIX" "text/html" "public, max-age=3600"
          put pnwhikes26/index.html "$PREFIX/index.html" "text/html" "public, max-age=300"

      - name: Invalidate CloudFront
        run: |
          # One wildcard path per run stays inside the free invalidation tier.
          PATHS="/$PREFIX/data/*"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            PATHS="$PATHS /$PREFIX /$PREFIX/index.html /$PREFIX/static/* /$PREFIX/vendor/*"
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths $PATHS

      - name: Verify what visitors will actually get
        run: |
          # A missing key returns the homepage at status 200 here, so status
          # codes prove nothing — check content type and size at the S3 origin.
          ORIGIN="http://$S3_BUCKET.s3-website-$AWS_REGION.amazonaws.com"
          fail=0
          check() {
            out=$(curl -sL -o /dev/null \
              -w "%{http_code}|%{content_type}|%{size_download}" "$ORIGIN/$1")
            code=${out%%|*}; rest=${out#*|}; type=${rest%%|*}; len=${rest##*|}
            if [ "$code" != "200" ] || [[ "$type" != *"$2"* ]] || [ "$len" -lt "$3" ]; then
              echo "  FAIL $1 -> $code $type ${len}B (wanted $2, >=${3}B)"
              fail=1
            else
              echo "  ok   $1 -> $type ${len}B"
            fi
          }
          check "$PREFIX/index.html"              "text/html"  30000
          check "$PREFIX/vendor/leaflet-1.9.4.js" "javascript" 100000
          check "$PREFIX/vendor/leaflet-1.9.4.css" "css"       10000
          check "$PREFIX/static/bundle-v1.json"   "json"       500000
          check "$PREFIX/data/env.json"           "json"       10000
          [ "$fail" = "0" ] || { echo "::error::published tree is incomplete"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### PNW Hikes '26 published"
            echo ""
            echo "<https://rickrothbart.com/pnwhikes26/>"
          } >> "$GITHUB_STEP_SUMMARY"
