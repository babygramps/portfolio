name: Rock Fire tracker teardown (/rockfire)

# One-shot removal of the retired Rock Fire tracker. Runs from Actions because
# local AWS credentials cannot write to this bucket. The accumulated data files
# were backed up to the rock-fire-viz repo (data/s3-final/) before this ran.
# Delete this workflow file once the run has succeeded.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/rockfire.yml"

concurrency:
  # Same group as the old hourly publish job so a straggling scheduled run
  # can't re-upload data after the teardown deletes it.
  group: rockfire-publish
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  S3_BUCKET: rick-portfolio-2025
  CLOUDFRONT_DISTRIBUTION_ID: E3HT67NT39EUN4
  PREFIX: rockfire

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete /rockfire from S3
        run: |
          # The extensionless redirect key first, then everything under the prefix.
          aws s3 rm "s3://$S3_BUCKET/$PREFIX" --only-show-errors || true
          aws s3 rm "s3://$S3_BUCKET/$PREFIX/" --recursive --only-show-errors
          echo "remaining keys under $PREFIX/ (should be none):"
          aws s3 ls "s3://$S3_BUCKET/$PREFIX/" --recursive || true

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/$PREFIX*"

      - name: Verify removal at the S3 origin
        run: |
          # The website origin genuinely 404s on missing keys (unlike the CDN,
          # which serves the homepage at 200), so 404 here proves deletion.
          ORIGIN="http://$S3_BUCKET.s3-website-$AWS_REGION.amazonaws.com"
          fail=0
          for k in "$PREFIX" "$PREFIX/index.html" "$PREFIX/data/stats.json" \
                   "$PREFIX/vendor/maplibre-gl-5.6.0.js"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$ORIGIN/$k")
            if [ "$code" = "404" ]; then
              echo "  gone: $k"
            else
              echo "  STILL PRESENT ($code): $k"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::rockfire keys survived teardown"; exit 1; }
