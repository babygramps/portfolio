name: Scheduling - remove the old rickrothbart.com/scheduling

# One-off teardown. The scheduling app moved to bigdogflip.com/scheduling
# (github.com/babygramps/scheduling) and its events were deliberately not
# carried over. This removes what the old deploy steps created: the static
# files under /scheduling, the Lambda and its function URL, the role policy
# that let the Lambda use the table, and the DynamoDB table with every event
# in it. Nothing here can be undone. Delete this file once it has run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete scheduling" to run'
        required: true

env:
  AWS_REGION: us-west-1
  S3_BUCKET: rick-portfolio-2025
  CLOUDFRONT_DISTRIBUTION_ID: E3HT67NT39EUN4
  NAME: rick-scheduling
  ROLE_NAME: rick-portfolio-lambda-role

jobs:
  teardown:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'delete scheduling' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove the old scheduling site and backend
        run: |
          FAILED=""
          # Runs one removal. "Already gone" counts as done so a rerun is safe.
          step() {
            local label="$1"; shift
            local out
            if out=$("$@" 2>&1); then
              echo "✅ $label"
            elif echo "$out" | grep -qE 'ResourceNotFoundException|NoSuchEntity|404|Not Found|does not exist'; then
              echo "✅ $label (already gone)"
            else
              echo "::error::$label failed: $out"
              FAILED="$FAILED\n- $label"
            fi
          }

          echo "Static files before: $(aws s3 ls "s3://$S3_BUCKET/scheduling/" --recursive | wc -l) under /scheduling/"
          echo "Table items before (approximate): $(aws dynamodb describe-table --table-name "$NAME" --query Table.ItemCount --output text 2>/dev/null || echo unknown)"

          # The trailing slash keeps this to the /scheduling/ folder only
          step "Static files under /scheduling/" aws s3 rm "s3://$S3_BUCKET/scheduling/" --recursive --only-show-errors
          # The extensionless copy that served /scheduling without a slash
          step "Extensionless /scheduling page" aws s3 rm "s3://$S3_BUCKET/scheduling" --only-show-errors

          step "Lambda function URL" aws lambda delete-function-url-config --function-name "$NAME"
          step "Lambda function" aws lambda delete-function --function-name "$NAME"
          step "Lambda log group" aws logs delete-log-group --log-group-name "/aws/lambda/$NAME"
          step "Role policy scheduling-dynamodb" aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name scheduling-dynamodb
          step "DynamoDB table" aws dynamodb delete-table --table-name "$NAME" --query TableDescription.TableStatus --output text

          step "CloudFront cache for /scheduling" aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/scheduling" "/scheduling/*" \
            --query Invalidation.Id --output text

          echo "Static files after: $(aws s3 ls "s3://$S3_BUCKET/scheduling" --recursive | grep -cE ' scheduling(/|$)' || true)"
          if [ -n "$FAILED" ]; then
            echo -e "Not removed:$FAILED"
            exit 1
          fi
          echo "✅ Old scheduling site removed"
